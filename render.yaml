# Site, API e banco PostgreSQL no plano gratuito do Render.
databases:
  - name: urbanlink-flow-db
    databaseName: urbanlink_flow_db
    user: urbanlink_flow_db_user
    plan: free
    region: virginia
    postgresMajorVersion: '18'
    ipAllowList: []

services:
  - type: web
    name: urbanlink-flow
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_CREATE_DATABASE
        value: 'false'
      - key: DB_SSL
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: urbanlink-flow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
