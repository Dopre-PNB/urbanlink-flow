# Site e API no plano gratuito do Render, usando um PostgreSQL já provisionado.
# DATABASE_URL é privada e deve apontar para a base lógica exclusiva do UrbanLink.
# O banco compartilhado é configurado fora deste Blueprint; veja docs/publicacao-github-render.md.
services:
  - type: web
    name: urbanlink-flow
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_CREATE_DATABASE
        value: 'false'
      - key: DB_SSL
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
