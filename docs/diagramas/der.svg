<polyline class="line" points="1430,468 1430,690"/>
<circle cx="1430" cy="468" r="4" fill="#386f94"/>
<circle cx="1430" cy="690" r="4" fill="#386f94"/>
<text x="1430" y="574" class="label" text-anchor="middle">1 recomendada em 0..N</text>
<polyline class="line" points="720,900 940,900"/>
<circle cx="720" cy="900" r="4" fill="#386f94"/>
<circle cx="940" cy="900" r="4" fill="#386f94"/>
<text x="830" y="878" class="label" text-anchor="middle">1 possui 0..N</text>
<polyline class="line" points="60,260 30,260 30,1260 1110,1260 1110,1085"/>
<circle cx="60" cy="260" r="4" fill="#386f94"/>
<circle cx="1110" cy="1085" r="4" fill="#386f94"/>
<text x="600" y="1247" class="label" text-anchor="middle">USUÁRIO 1 executa 0..N SIMULAÇÕES · usuario_id</text>
<polyline class="line optional" points="60,360 12,360 12,1330 1370,1330 1370,1085"/>
<circle cx="60" cy="360" r="4" fill="#965989"/>
<circle cx="1370" cy="1085" r="4" fill="#965989"/>
<text x="735" y="1317" class="label" text-anchor="middle">USUÁRIO 0..1 atualiza 0..N SIMULAÇÕES · atualizado_por_id</text>
<text x="60" y="1395" class="small" text-anchor="start">Todas as FKs usam ON DELETE RESTRICT e ON UPDATE RESTRICT. Tipos completos, domínios e regras estão em docs/modelo-logico.md.</text>
</svg>
